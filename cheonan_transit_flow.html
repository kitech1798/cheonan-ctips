<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>천안 대중교통 이동흐름 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f4f6f9;--surface:#fff;--surface-2:#eef1f6;--ink:#161b26;--sub:#5a6474;--line:#e2e7ef;
  --accent:#1f6feb;--accent-ink:#0b4bbd;--green:#1a9d63;--amber:#e08a00;--red:#d64545;--violet:#8b5cf6;
  --shadow:0 1px 3px rgba(20,27,38,.08),0 8px 24px rgba(20,27,38,.06);--r:14px;}
@media (prefers-color-scheme:dark){:root{--bg:#0d1017;--surface:#161b26;--surface-2:#1e2432;--ink:#e9edf5;
  --sub:#9aa5b8;--line:#28303f;--accent:#5b9bff;--accent-ink:#8fbaff;--shadow:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);}}
:root[data-theme=dark]{--bg:#0d1017;--surface:#161b26;--surface-2:#1e2432;--ink:#e9edf5;--sub:#9aa5b8;
  --line:#28303f;--accent:#5b9bff;--accent-ink:#8fbaff;--shadow:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);}
:root[data-theme=light]{--bg:#f4f6f9;--surface:#fff;--surface-2:#eef1f6;--ink:#161b26;--sub:#5a6474;--line:#e2e7ef;--accent:#1f6feb;--accent-ink:#0b4bbd;}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);
  color:var(--ink);word-break:keep-all;line-height:1.6;-webkit-font-smoothing:antialiased;}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;}
header{display:flex;align-items:center;gap:16px;padding:11px 20px;background:var(--surface);
  border-bottom:1px solid var(--line);z-index:1200;flex-wrap:wrap;}
.brand h1{font-size:18px;margin:0;letter-spacing:-.02em;font-weight:800;}
.brand .tag{font-size:12px;color:var(--sub);}
.hstats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:92px;}
.stat b{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.stat span{font-size:11px;color:var(--sub);}
.theme-btn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:15px;}
.main{display:grid;grid-template-columns:250px 1fr 380px;min-height:0;}
@media (max-width:1150px){.main{grid-template-columns:1fr;}#map{height:44vh;}}
.side,.right{overflow-y:auto;background:var(--surface);}
.side{border-right:1px solid var(--line);padding:14px;}
.right{border-left:1px solid var(--line);padding:16px;}
#map{height:100%;min-height:320px;z-index:1;}
.sh{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin:16px 0 8px;}
.sh:first-child{margin-top:2px;}
.modes{display:flex;flex-direction:column;gap:3px;}
.mode{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;cursor:pointer;border:1px solid transparent;font-size:13.5px;color:var(--ink);background:transparent;text-align:left;width:100%;}
.mode:hover{background:var(--surface-2);}
.mode.on{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent-ink);font-weight:700;}
.mode .ic{font-size:16px;width:20px;text-align:center;}
.mode.disabled{opacity:.4;cursor:not-allowed;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--sub);cursor:pointer;}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.legend{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.9;}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.card h3{margin:0 0 3px;font-size:14px;letter-spacing:-.01em;}
.card .d{font-size:12px;color:var(--sub);margin-bottom:10px;}
.rank{display:flex;flex-direction:column;gap:5px;}
.bar{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;}
.bar:hover .nm{color:var(--accent);}
.bar .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar .track{height:16px;background:var(--surface-2);border-radius:5px;overflow:hidden;}
.bar .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--violet)));}
.bar .vl{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;}
.b-green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green);}
.b-amber{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber);}
.b-red{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red);}
.b-gray{background:var(--surface-2);color:var(--sub);}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;}
.kv .box{background:var(--surface-2);border-radius:10px;padding:8px 10px;}
.kv .box b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;}
.kv .box span{font-size:11px;color:var(--sub);}
.interp{background:color-mix(in srgb,var(--accent) 8%,transparent);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px;margin:10px 0;}
.chart-t{font-size:11px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;}
.note{display:flex;gap:9px;align-items:flex-start;background:color-mix(in srgb,var(--amber) 11%,transparent);border:1px solid color-mix(in srgb,var(--amber) 38%,transparent);border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:12px;}
.note b{color:var(--amber);}
.mini-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:4px;}
.mini-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle;}
svg text{fill:var(--sub);}
.priv{font-size:11px;color:var(--sub);background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:5px 10px;max-width:440px;}
.close{float:right;border:0;background:transparent;color:var(--sub);cursor:pointer;font-size:18px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>천안 대중교통 이동흐름 지도</h1>

    <div id="map"></div>

  </div>
</div>

function usageOf(s,metric,period,user){
  const ps=period==='all'?[0,1,2,3,4]:[+period], us=user==='all'?[0,1,2,3,4]:[+user];
  let v=0; for(const p of ps)for(const u of us){ if(metric!=='alight')v+=s.boardings[p][u]; if(metric!=='board')v+=s.alightings[p][u]; }
  return v;
}
const metricLabel=()=>state.metric==='board'?'승차':state.metric==='alight'?'하차':'총이용';
function getVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

// ---------- 지도 ----------
const isDark=()=>(document.documentElement.dataset.theme||'')==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);
let map,tile,supLayer,pinLayer,canvas;
function baseTile(){const u=isDark()?'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png':'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
  return L.tileLayer(u,{maxZoom:19,attribution:'© OpenStreetMap · © CARTO'});}
function initMap(){map=L.map('map',{zoomControl:true,preferCanvas:true}).setView(M.center,12);
  tile=baseTile().addTo(map);canvas=L.canvas({padding:.5});
  supLayer=L.layerGroup().addTo(map);pinLayer=L.layerGroup().addTo(map);drawMap();}
function drawMap(){
  supLayer.clearLayers();pinLayer.clearLayers();
  const showSup=!PINS||state.mode==='supply';
  for(const s of SUP)L.circleMarker([s.lat,s.lon],{renderer:canvas,radius:showSup?2.6:1.4,weight:0,fillColor:'#7f8ca3',fillOpacity:showSup?.5:.25}).addTo(supLayer);
  if(PINS&&state.mode!=='supply'){
    const vals=STOP.filter(s=>s.matched).map(s=>usageOf(s,state.metric,state.period,state.user));
    const mx=Math.max(1,...vals);
    for(const s of STOP){if(!s.matched)continue;const v=usageOf(s,state.metric,state.period,state.user);if(v<=0)continue;
      const r=4+22*Math.sqrt(v/mx),col=getVar('--accent');
      const mk=L.circleMarker([s.lat,s.lon],{renderer:canvas,radius:r,weight:1,color:col,fillColor:col,fillOpacity:.55});
      mk.bindTooltip(`${s.stop_name||s.sttn_id} · ${metricLabel()} ${K(v)}`,{direction:'top'});
      mk.addTo(pinLayer);}
  }
}

  document.querySelectorAll('#uc .chip').forEach(c=>c.onclick=()=>{state.user=c.dataset.u;render();});
  document.getElementById('mc').innerHTML=[['board','승차'],['alight','하차'],['both','총이용']].map(([k,l])=>`<span class="chip ${state.metric===k?'on':''}" data-k="${k}">${l}</span>`).join('');
  document.querySelectorAll('#mc .chip').forEach(c=>c.onclick=()=>{state.metric=c.dataset.k;render();});
  document.getElementById('legend').innerHTML = PINS
    ? `<div>원 크기 = ${metricLabel()}량</div>`
    : `<div><span class="dot" style="background:#7f8ca3"></span>회색 점 = 실 정류장(공급)</div><div style="margin-top:6px">수요는 우측 법정동 분석 참조</div>`;
}

// ---------- SVG 차트 ----------
function timeChart(bd,al){
  const W=340,H=96,pad=6,n=5,bw=(W-pad*2)/n,mx=Math.max(1,...bd,...al);let g='';
  for(let i=0;i<n;i++){const x=pad+i*bw,hb=(H-26)*bd[i]/mx,ha=(H-26)*al[i]/mx;
    g+=`<rect x="${x+5}" y="${H-22-hb}" width="${bw/2-5}" height="${hb}" fill="#1f6feb" rx="2"/>`;
    g+=`<rect x="${x+bw/2+2}" y="${H-22-ha}" width="${bw/2-5}" height="${ha}" fill="#e08a00" rx="2"/>`;
    g+=`<text x="${x+bw/2}" y="${H-7}" font-size="9.5" text-anchor="middle">${['출근','오전','오후','퇴근','야간'][i]}</text>`;}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg><div class="mini-legend"><span><i style="background:#1f6feb"></i>승차</span><span><i style="background:#e08a00"></i>하차</span></div>`;
}
function userChart(u){const tot=u.reduce((a,b)=>a+b,0)||1;let x=0,g='';
  u.forEach((v,i)=>{const w=340*v/tot;if(w>0){g+=`<rect x="${x}" y="0" width="${w}" height="18" fill="${UCOL[i]}"/>`;x+=w;}});
  return `<svg viewBox="0 0 340 18" width="100%" style="border-radius:5px;overflow:hidden">${g}</svg><div class="mini-legend">${UL.map((l,i)=>u[i]?`<span><i style="background:${UCOL[i]}"></i>${l} ${(u[i]/tot*100).toFixed(0)}%</span>`:'').join('')}</div>`;
}

// ---------- 랭킹(법정동/정류장) ----------
function rankPanel(){
  const isStop=state.mode==='stops';
  const pool=isStop?STOP:EMD;
  const scored=pool.map(x=>({x,v:usageOf(x,state.metric,state.period,state.user)})).filter(o=>o.v>0).sort((a,b)=>b.v-a.v).slice(0,isStop?20:15);
  const mx=scored.length?scored[0].v:1;
  const nameOf=x=>isStop?(x.stop_name||`${x.emd} ${x.sttn_id}`):x.emd;
  const sub=state.mode==='timeflow'?`시간대: ${state.period==='all'?'전체':PL[state.period]}`:state.mode==='user'?`유형: ${state.user==='all'?'전체':UL[state.user]}`:'';
  const title=isStop?'정류장 이용 랭킹':'법정동 이용 랭킹';
  let h=`<div class="card"><h3>${isStop?'📊':'🔥'} ${title} <span style="font-weight:400;color:var(--sub);font-size:12px">· ${metricLabel()}${sub?' · '+sub:''}</span></h3><div class="d">필터를 바꾸면 즉시 재정렬됩니다${isStop?' (좌표 연계 시 지도 핀 동기화)':''}.</div><div class="rank">`;
  h+=scored.map((o,i)=>`<div class="bar" data-k="${isStop?o.x.sttn_id:o.x.emd}" data-stop="${isStop?1:0}"><span class="nm">${i+1}. ${nameOf(o.x)}</span><span class="track"><span class="fill" style="width:${(o.v/mx*100).toFixed(1)}%"></span></span><span class="vl">${K(o.v)}</span></div>`).join('');
  h+=`</div></div>`;
  return h;
}
function routePanel(){
  const rs=ROUTES.filter(r=>r.interval_min).slice().sort((a,b)=>b.daily_trips-a.daily_trips);
  const mx=Math.max(...rs.map(r=>r.daily_trips),1);
  let h=`<div class="card"><h3>🚍 노선 공급(실데이터)</h3><div class="d">1일 운행횟수·배차간격. 노선별 카드이용량 연계 시 수요-공급 불일치 자동 계산.</div><div class="rank">`;
  h+=rs.slice(0,20).map((r,i)=>`<div class="bar"><span class="nm">${i+1}. ${r.route_name}</span><span class="track"><span class="fill" style="width:${(r.daily_trips/mx*100).toFixed(1)}%"></span></span><span class="vl">${r.daily_trips}회·${r.interval_min}분</span></div>`).join('');
  return h+`</div></div>`;
}

// ---------- 상세 ----------
function detail(rec,isStop){
  const b=usageOf(rec,'board','all','all'),a=usageOf(rec,'alight','all','all');
  const bd=[0,1,2,3,4].map(p=>rec.boardings[p].reduce((x,y)=>x+y,0));
  const al=[0,1,2,3,4].map(p=>rec.alightings[p].reduce((x,y)=>x+y,0));
  const nm=isStop?(rec.stop_name||`정류장 ${rec.sttn_id}`):rec.emd;
  return `<div class="card"><button class="close" onclick="state.sel=null;renderRight()">×</button>
    <h3 style="font-size:18px">${nm}</h3><div class="d">${isStop?`정류장ID ${rec.sttn_id} · ${rec.emd||''}`:'법정동'} · 피크 ${rec.peak} · 주이용 ${rec.top_user}</div>
    <div class="kv"><div class="box"><b>${K(rec.daily_b)}</b><span>월 승차</span></div><div class="box"><b>${K(rec.daily_a)}</b><span>월 하차</span></div>
    <div class="box"><b>${(rec.commute_ratio*100).toFixed(0)}%</b><span>출근 승차 집중</span></div><div class="box"><b>${(rec.return_ratio*100).toFixed(0)}%</b><span>귀가 하차 집중</span></div></div>
    <div class="interp">${interpret(rec)}</div>
    <div class="chart-t">시간대별 승·하차</div>${timeChart(bd,al)}
    <div class="chart-t">이용자 유형 구성</div>${userChart(rec.by_user)}</div>`;
}
function interpret(r){const p=[];const u=r.by_user,t=u.reduce((a,b)=>a+b,0)||1;
  if(r.commute_ratio>=.24)p.push(`오전 6~9시 승차 비중 ${(r.commute_ratio*100).toFixed(0)}%로 <b>통근·통학 출발 성격</b>`);
  if(r.return_ratio>=.24)p.push(`오후 17~20시 하차 비중 ${(r.return_ratio*100).toFixed(0)}%로 <b>귀가 수요 집중</b>`);
  if(u[3]/t>=.2)p.push(`경로 비중 ${(u[3]/t*100).toFixed(0)}%로 <b>교통약자 시설 점검 우선순위</b>`);
  if(u[1]/t>=.25)p.push(`청소년 비중 ${(u[1]/t*100).toFixed(0)}%로 <b>통학 수요 큼</b>`);
  if(!p.length)p.push(`피크는 <b>${r.peak}</b>, 주 이용층은 <b>${r.top_user}</b>`);
  return p.join('. ')+'.';
}

// ---------- 우측 ----------
function renderRight(){
  const el=document.getElementById('right');
  if(state.sel){el.innerHTML=detail(state.sel.rec,state.sel.isStop);return;}
  let h='';
  if(!PINS&&HAS)h+=`<div class="note"><span>ℹ️</span><div><b>정류장 핀 지도 연계 대기</b><br>교통카드 합성데이터의 정류장ID는 좌표가 없어, 지도 핀은 <b>국토부_버스정류장(15142032)</b> 연계 시 표시됩니다. 지금은 <b>법정동·시간대·유형 실데이터</b>로 분석합니다.</div></div>`;
  if(!HAS){el.innerHTML=`<div class="note"><span>⏳</span><div><b>수요 데이터 연계 대기</b> — 정류장·노선·배차는 실데이터. 교통카드 API 연계 시 자동 반영.</div></div>`+routePanel();return;}
  if(state.mode==='route'){el.innerHTML=h+routePanel();return;}
  if(state.mode==='supply'){el.innerHTML=`<div class="card"><h3>📍 공급 현황(실데이터)</h3><div class="kv"><div class="box"><b>${K(M.stop_supply)}</b><span>정류장</span></div><div class="box"><b>${K(M.route_supply)}</b><span>버스노선</span></div></div><p style="font-size:12.5px;color:var(--sub)">회색 점 = 실제 정류장 위치. 배차간격은 노선별 1일 운행횟수에서 도출.</p></div>`+routePanel();return;}
  // hotspot/timeflow/user/stops → 랭킹 + 전역 차트 + 인사이트
  h+=rankPanel();
  if(state.mode==='timeflow'){const tp=M.time_profile;h+=`<div class="card"><h3>⏱️ 천안 전체 시간대 프로파일</h3><div class="d">전 법정동 합산 실측</div>${timeChart(tp.map(x=>x[0]),tp.map(x=>x[1]))}</div>`;}
  if(state.mode==='user'){h+=`<div class="card"><h3>👥 천안 전체 이용자 구성</h3><div class="d">전 법정동 합산 실측</div>${userChart(M.user_profile)}</div>`;}
  for(const c of CARDS)h+=`<div class="card"><h3>${c.icon} ${c.title}</h3><div class="d">${c.desc}</div><div class="rank">${c.items.map((it,i)=>`<div class="bar" data-k="${it.name}" data-stop="0"><span class="nm">${i+1}. ${it.name}</span><span class="track"></span><span class="vl">${it.val}</span></div>`).join('')}</div></div>`;
  el.innerHTML=h;
  bindBars();
}
function bindBars(){
  document.querySelectorAll('.bar[data-k]').forEach(b=>b.onclick=()=>{
    const isStop=b.dataset.stop==='1';
    const rec=isStop?STOP.find(x=>String(x.sttn_id)===b.dataset.k):EMD.find(x=>x.emd===b.dataset.k);
    if(rec){state.sel={rec,isStop};renderRight();if(isStop&&rec.matched)map.setView([rec.lat,rec.lon],15);}
  });
}

// ---------- 헤더 ----------
function header(){
  document.getElementById('priv').textContent=M.privacy;
  document.getElementById('ds').innerHTML=HAS?`<span style="color:var(--green);font-weight:700">수요 실데이터 (${M.card.period||''})</span>`:`<span style="color:var(--amber);font-weight:700">수요 연계 대기</span>`;
  const s=HAS?[[K(M.card.total_b),'월 승차'],[K(M.card.total_a),'월 하차'],[K(M.card.emd_count),'분석 법정동'],[K(M.card.stop_count),'정류장'],[K(M.route_supply),'노선']]
    :[[K(M.stop_supply),'정류장(실)'],[K(M.route_supply),'노선(실)'],['연계대기','승하차 수요']];
  document.getElementById('hstats').innerHTML=s.map(([b,t])=>`<div class="stat"><b>${b}</b><span>${t}</span></div>`).join('');
}
function render(){controls();drawMap();renderRight();}
document.getElementById('themeBtn').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=cur==='dark'?'light':'dark';if(tile){map.removeLayer(tile);tile=baseTile().addTo(map);}render();};
header();initMap();render();
</script>
